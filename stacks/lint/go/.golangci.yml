# golangci-lint v2. Check: golangci-lint run ./... (exit 1 on issues; --fix is opt-in)
version: "2"
linters:
  default: none
  enable: [errcheck, errorlint, bodyclose, gosec, govet, staticcheck, unused, unparam, ineffassign, funlen, gocyclo, gocognit, nestif, exhaustive, gochecksumtype, godox, gocritic, revive, gochecknoglobals]
  settings:
    funlen: { lines: 15, statements: 15 }
    gocyclo: { min-complexity: 9 }
    gocognit: { min-complexity: 9 }
    errcheck: { check-blank: true, check-type-assertions: true }
    exhaustive: { default-signifies-exhaustive: false }
    godox: { keywords: [TODO, FIXME, HACK] }
    gocritic: { enabled-checks: [commentedOutCode, todoCommentWithoutDetail] }
    revive:
      rules:
        - { name: argument-limit, arguments: [3] }
        - { name: flag-parameter }
        - { name: max-control-nesting, arguments: [2] }
        - { name: function-length, arguments: [15, 15] }
        - { name: cognitive-complexity, arguments: [8] }
        - { name: empty-block }
        - { name: unhandled-error }
        - { name: unused-parameter }
